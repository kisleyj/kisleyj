name: Atualizar JeffersonOS Red

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/**'
      - '.github/workflows/update-dashboard.yml'
  schedule:
    - cron: '23 9 1 * *'

permissions:
  contents: write

concurrency:
  group: jeffersonos-dashboard
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Atualizar dados públicos do GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_dashboard.py
      - name: Preparar renderização do painel animado
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0" "CairoSVG==2.8.2"
      - name: Gerar GIF com os dados atualizados
        run: python scripts/render_animation.py
      - name: Salvar apenas quando os dados mudarem
        run: |
          if ! git diff --quiet -- assets/dashboard-red.svg assets/dashboard-red.gif; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/dashboard-red.svg assets/dashboard-red.gif
            git commit -m 'chore(painel): atualiza dados públicos'
            git push
          fi
